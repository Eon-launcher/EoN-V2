name: EoN Launcher V2 Debug APK

# Modified by EoN Launcher V2: standalone source-build workflow without private SDKs.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect APK native libraries
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "Native libraries in $apk:"
            unzip -l "$apk" | grep 'lib/' || true
            echo "libgxcore.so dependencies in $apk:"
            if unzip -p "$apk" lib/arm64-v8a/libgxcore.so > "$RUNNER_TEMP/libgxcore.so"; then
              readelf -d "$RUNNER_TEMP/libgxcore.so"
            else
              echo "lib/arm64-v8a/libgxcore.so is missing from $apk"
            fi
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EoN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-reports
          path: app/build/reports/
          if-no-files-found: warn
