name: EoN Launcher V2 Android CI

# Modified by EoN Launcher V2: source builds no longer require private SDK files or Firebase config.
on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

  build:
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify installed SDK Packages
        run: sdkmanager --list

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        run: ./gradlew assembleDebug assembleBeta assembleRelease

      - name: Verify native emutls export and inspect gxcore imports
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/{debug,beta,release}/*.apk; do
            unzip -p "$apk" lib/arm64-v8a/libdiscord_partner_sdk.so > "$RUNNER_TEMP/libdiscord_partner_sdk.so"
            unzip -p "$apk" lib/arm64-v8a/libgxcore.so > "$RUNNER_TEMP/libgxcore.so"
            echo "Defined symbols in libdiscord_partner_sdk.so ($apk):"
            nm -D --defined-only "$RUNNER_TEMP/libdiscord_partner_sdk.so" > "$RUNNER_TEMP/discord_symbols.txt"
            cat "$RUNNER_TEMP/discord_symbols.txt"
            awk '{print $NF}' "$RUNNER_TEMP/discord_symbols.txt" | grep -Fx '__emutls_get_address'
            echo "libgxcore.so undefined symbols without version tags ($apk):"
            nm -D --undefined-only "$RUNNER_TEMP/libgxcore.so" | grep -v '@' || true
          done

      - name: Inspect APK native libraries
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/{debug,beta,release}/*.apk; do
            echo "Native libraries in $apk:"
            unzip -l "$apk" | grep 'lib/' || true
            echo "libgxcore.so dependencies in $apk:"
            if unzip -p "$apk" lib/arm64-v8a/libgxcore.so > "$RUNNER_TEMP/libgxcore.so"; then
              readelf -d "$RUNNER_TEMP/libgxcore.so"
            else
              echo "lib/arm64-v8a/libgxcore.so is missing from $apk"
            fi
          done

      - name: App Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EoN-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload R8 mappings
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EoN-r8-mappings-${{ github.sha }}
          path: |
            app/build/outputs/mapping/debug/
            app/build/outputs/mapping/beta/
            app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EoN-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EoN-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: kevin-david/zipalign-sign-android-release@v2
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_STORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename APK with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME}
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_DST="EoN-${TAG}-release.apk"
          cp "$SIGNED_APK" "$APK_DST"
          echo "Signed APK renamed to $APK_DST"

      - name: Upload Signed APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: EoN-${{ github.ref_name }}-release.apk
          path: EoN-${{ github.ref_name }}-release.apk

      - name: Generate GitHub release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md

      - name: Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EoN-${{ github.ref_name }}-release.apk
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/EoN-${{ github.ref_name }}-release.apk"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          EMBED_TITLE="🚀 EoN Launcher V2 update!"
          EMBED_DESC="A new version of **EoN Launcher V2** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://raw.githubusercontent.com/txqeaandrei-png/EoN-V2/main/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"📦 Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔗 Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"
